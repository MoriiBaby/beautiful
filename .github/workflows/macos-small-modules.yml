name: Stheno reconstruction macOS validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'rebuild/**'

permissions:
  contents: read

jobs:
  small-modules:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Install GNU make and ldid
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install make ldid xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Check Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version
          xcrun --sdk iphoneos swiftc --version
      - name: Prepare pinned RootHide Theos
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          export THEOS
          git clone --filter=blob:none --no-checkout https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach cfba89a53a05b4a1b822121158acc3669c20602f
          git -C "$THEOS" submodule update --init --recursive
          test "$(git -C "$THEOS/vendor/include" rev-parse HEAD)" = 744ee65cd464becd8b06cab6eaeffc0512b371f1
          test "$(git -C "$THEOS/vendor/lib" rev-parse HEAD)" = 85e9b5b8aff11bbefc59525c64c8f55149926e56
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Build Camera and Keyboard only
        run: bash CI/build_small_modules.sh
      - name: Verify Mach-O and collect development artifacts
        run: python3 CI/verify_artifacts.py
      - name: Compile disabled scene and Swift candidates
        run: python3 CI/compile_candidates.py
      - name: Upload incomplete development build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stheno-rebuild-dev1-small-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
